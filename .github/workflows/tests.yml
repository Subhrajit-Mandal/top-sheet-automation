name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # A stuck run fails after 15 minutes with a clear "timed out" message instead of hanging for hours.
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"   # same text encoding on Windows and Linux
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m unittest -v

      - name: Smoke-test the example files
        run: |
          python generate_top_sheets.py \
            --workbook examples/Template_student_data.xlsx \
            --template examples/ME_CA1_2026.docx \
            --config config.json --output ci_output \
            --answer 5,4 --exam-date 01-01-2027 --no-prompt --keep-docx-only
          python -c "import pathlib; n = len(list(pathlib.Path('ci_output/docx').glob('*.docx'))); assert n == 16, n; print(n, 'sheets generated')"
